name: Build Jarvis APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.11.1 }
      - name: Restore signing key
        id: key
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ] && echo "$KS" | tr -d '[:space:]' | base64 -d > avash.jks 2>/dev/null && [ -s avash.jks ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            rm -f avash.jks
            echo "::warning::KEYSTORE_B64 secret is missing or invalid - building with a temporary key (no release)"
          fi
      - run: gradle --no-daemon assembleRelease -PversionCode=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: app/build/outputs/apk/release/app-release.apk
      - name: Publish release (used by the in-app updater)
        if: steps.key.outputs.has == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Jarvis build ${{ github.run_number }}
          files: app/build/outputs/apk/release/app-release.apk
          make_latest: true
